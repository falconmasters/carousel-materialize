<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Materilize | Carrousel y Media</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Dancing+Script|Raleway:500,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- CSS Estilos -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="pagina-principal">
        <header class="encabezado">
            <h1 class="titulo">¿Qué se te antoja hoy?</h1>
            <div class="linea-division" aria-hidden="true"></div>
        </header>

        <div class="carousel" aria-label="Carrusel de postres">
            <a class="carousel-item" href="#one!">
                <img src="img/dona-01.jpg" alt="Donas glaseadas">
                <div class="info-item">
                    <h2 class="subtitulo">Donas</h2>
                    <p class="sabor">Glaseadas</p>
                </div>
            </a>

            <a class="carousel-item" href="#two!">
                <img src="img/pastel-01.jpg" alt="Pastel de chocolate">
                <div class="info-item">
                    <h2 class="subtitulo">Pastel</h2>
                    <p class="sabor">Chocolate</p>
                </div>
            </a>

            <a class="carousel-item" href="#three!">
                <img src="img/muffins-01.jpg" alt="Muffins de chocolate">
                <div class="info-item">
                    <h2 class="subtitulo">Muffins</h2>
                    <p class="sabor">Chocolate</p>
                </div>
            </a>

            <a class="carousel-item" href="#four!">
                <img src="img/dona-02.jpg" alt="Donas merengue">
                <div class="info-item">
                    <h2 class="subtitulo">Donas</h2>
                    <p class="sabor">Merengue</p>
                </div>
            </a>

            <a class="carousel-item" href="#five!">
                <img src="img/pastel-02.jpg" alt="Pastel mil hojas">
                <div class="info-item">
                    <h2 class="subtitulo">Pastel</h2>
                    <p class="sabor">Mil hojas</p>
                </div>
            </a>

            <a class="carousel-item" href="#six!">
                <img src="img/muffins-02.jpg" alt="Muffins de vainilla">
                <div class="info-item">
                    <h2 class="subtitulo">Muffins</h2>
                    <p class="sabor">Chocolate</p>
                </div>
            </a>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
